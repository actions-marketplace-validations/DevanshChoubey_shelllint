name: Release

# Builds release binaries for a pushed version tag (for example v0.1.0) and
# attaches them, with SHA-256 checksums, to a **draft** GitHub release. A
# maintainer reviews the draft and publishes it by hand.
#
# Assets: shelllint-<tag>-<target>.tar.gz (.zip on Windows), one
# .sha256 per archive, a combined SHA256SUMS, and version-less copies
# shelllint-latest-<target>.* (listed in SHA256SUMS too) so that
# `releases/latest/download/...` works for action.yml `version: latest`.
# The docker-image job pushes the static image (repo Dockerfile) to
# ghcr.io/<owner>/shelllint:<version> and :latest for the
# pre-commit docker hook, plus an Alpine variant with a shell as
# :<version>-alpine and :alpine (for GitLab CI and similar runners).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BIN: shelllint

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, run: true }
          # The ubuntu-24.04-arm runner is free for public repositories only.
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, run: true }
          - { target: aarch64-apple-darwin, os: macos-latest, musl: false, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, musl: false, run: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, musl: false, run: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
          rustup default stable
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: cargo build --release --locked -p shelllint --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.run
        run: |
          exe="target/${{ matrix.target }}/release/$BIN"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          printf 'echo $1\n' > smoke.sh
          # Exit code 1 means warnings were found, which is the expected result.
          set +e; "$exe" -s bash -f gcc smoke.sh; rc=$?; set -e
          [ "$rc" -eq 1 ]
      - name: Package
        id: package
        run: |
          tag="${GITHUB_REF_NAME}"
          name="$BIN-$tag-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE NOTICE README.md CHANGELOG.md "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/$BIN.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Version-less aliases and combined checksum file
        run: |
          set -euo pipefail
          cd dist
          # shelllint-v1.2.3-<target>.tar.gz -> shelllint-latest-<target>.tar.gz
          for f in "$BIN-$GITHUB_REF_NAME"-*.tar.gz "$BIN-$GITHUB_REF_NAME"-*.zip; do
            [ -f "$f" ] || continue
            cp "$f" "$BIN-latest-${f#"$BIN-$GITHUB_REF_NAME"-}"
          done
          sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      # TODO(owner): attest the archives too. Add `id-token: write` and
      # `attestations: write` to this job's permissions, then (pinned by SHA):
      #   - uses: actions/attest-build-provenance@<SHA> # vX.Y.Z
      #     with:
      #       subject-path: |
      #         dist/*.tar.gz
      #         dist/*.zip
      #         dist/SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS

  docker-image:
    name: docker image
    needs: build
    runs-on: ubuntu-latest
    # linux/arm64 builds under QEMU with fat LTO, which is slow.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and tags
        id: meta
        run: |
          # ghcr.io names must be lowercase; tags drop the leading v.
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/shelllint"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:latest"
            echo "EOF"
            echo "alpine_tags<<EOF"
            echo "$image:$version-alpine"
            echo "$image:alpine"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      # Alpine variant (has a shell). Same build stage, so the layers are
      # cached from the build above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.alpine_tags }}
      # TODO(owner): artifact attestations (SLSA build provenance). Needs a
      # commit SHA for actions/attest-build-provenance that could not be
      # verified offline, so nothing is enabled here. To enable: look up the
      # SHA of the current release tag, pin it with a version comment like the
      # other actions, add `id-token: write` and `attestations: write` (and
      # `packages: write`, already set) to this job's permissions, give the
      # docker build steps `id: push`, and uncomment:
      #
      # - uses: actions/attest-build-provenance@<SHA> # vX.Y.Z
      #   with:
      #     subject-name: ghcr.io/<lowercase owner>/shelllint
      #     subject-digest: ${{ steps.push.outputs.digest }}
      #     push-to-registry: true
