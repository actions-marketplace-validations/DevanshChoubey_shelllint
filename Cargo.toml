[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "An unofficial Rust port of ShellCheck, the shell script static analysis tool"
repository = "https://github.com/DevanshChoubey/shelllint"
homepage = "https://github.com/DevanshChoubey/shelllint"
readme = "README.md"
keywords = ["shellcheck", "shell", "bash", "linter", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"

# The internal crates, with the version crates.io needs to resolve them
# once published (bump together with workspace.package.version).
[workspace.dependencies]
shelllint-core = { path = "crates/core", version = "0.2.1" }
shelllint-parser = { path = "crates/parser", version = "0.2.1" }
shelllint-analyzer = { path = "crates/analyzer", version = "0.2.1" }
shelllint-checks = { path = "crates/checks", version = "0.2.1" }
shelllint-checker = { path = "crates/checker", version = "0.2.1" }
shelllint-formatter = { path = "crates/formatter", version = "0.2.1" }

[profile.release]
lto = true
codegen-units = 1

# The pathological-input tests (crates/conformance/tests/pathological.rs)
# must finish in 10 s under `cargo test`; unoptimised, the parser takes
# ~15-20 s on 50,000 lines. Optimise the pipeline crates in dev/test builds.
[profile.dev.package.shelllint-parser]
opt-level = 2
[profile.dev.package.shelllint-core]
opt-level = 2
[profile.dev.package.shelllint-analyzer]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2

# Clippy lints that fight a faithful port of the Haskell source. CI runs
# `cargo clippy --workspace --all-targets -- -D warnings`.
[workspace.lints.clippy]
# Nested `if`/`if let` mirror Haskell guards, `case` arms and `when` blocks
# one-to-one; collapsing them into let-chains hides that correspondence.
collapsible_if = "allow"
collapsible_else_if = "allow"
# Same for an `if` inside a `match` arm (newer clippy: collapsible_match).
collapsible_match = "allow"
# Boolean expressions are transcribed from Haskell (`not (a && b)` etc.).
nonminimal_bool = "allow"
# Types spell out the Haskell signatures they port.
type_complexity = "allow"
# Enum variants keep their Haskell constructor names.
enum_variant_names = "allow"
# Haskell guards with equal bodies stay separate branches, as written.
if_same_then_else = "allow"
# `..new_analysis_result()` ports Haskell record update syntax
# (`newAnalysisResult { arComments = ... }`), kept even when every field
# is set.
needless_update = "allow"
# Local names (`foo`, `bar`) are the Haskell source's.
disallowed_names = "allow"
